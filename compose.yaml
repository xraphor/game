name: nuke-pc
services:
  desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: America/Sao_Paulo
      CUSTOM_USER: "${DESKTOP_USER:-nuke}"
      PASSWORD: "${DESKTOP_PASSWORD:?Execute o script de inicio para gerar a senha}"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - desktop-data:/config
    shm_size: "1gb"
    restart: unless-stopped
volumes:
  desktop-data:
